<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan · Hensel Family Adventure Atlas</title>
<link rel="stylesheet" href="/atlas/atlas.css">
<style>
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .pl-steps{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pl-steps button{width:100%;min-height:44px;border:1.5px solid var(--border);background:var(--card);color:var(--pine);border-radius:10px;
    font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.15}
  .pl-steps button b{font-family:var(--mono);font-size:11px;color:var(--amber-deep)}
  .pl-steps button[aria-current="step"]{background:var(--pine);color:#fff;border-color:var(--pine)}
  .pl-steps button[aria-current="step"] b{color:var(--amber)}
  .pl-steps button:disabled{opacity:.5;cursor:not-allowed}
  .pl-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .pl-card h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
  .pl-card h2:focus{outline:none}
  .pl-help{color:var(--muted);font-size:14px;margin:0 0 14px}
  .pl-msg{min-height:0;margin:0 0 10px;font-size:14px;color:var(--pine);font-weight:600}
  .pl-msg:empty{display:none}
  .pl-err{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#FBEDE8;border:1px solid var(--t-hi);color:var(--t-hi);font-size:14px}
  .pl-select,.pl-text,.pl-date,.pl-area{width:100%;min-height:44px;font-family:var(--sans);font-size:16px;border:1.5px solid var(--border);border-radius:8px;background:var(--paper);color:var(--ink);padding:8px 10px}
  .pl-area{min-height:84px;resize:vertical}
  .pl-lab{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
  .pl-btn{min-height:44px;padding:8px 16px;font-size:14px}
  .pl-btn[disabled]{opacity:.5;cursor:not-allowed}
  .pl-presets{display:flex;flex-wrap:wrap;gap:8px}
  .pl-presets .qrbtn{min-height:40px}
  .pl-suggest{margin:14px 0 4px;border:1px solid var(--border);border-radius:10px;padding:0 12px;background:var(--paper)}
  .pl-suggest>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--pine)}
  .pl-suggest .body{padding:0 0 12px}
  .pl-tfc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px}
  .pl-tfc .ip input{width:80px;min-height:30px;font-size:16px}
  .pl-suggest .tf-card{margin-bottom:8px}
  .pl-suggest .qrbtn{min-height:40px}
  .pl-stops{list-style:none;margin:14px 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
  .pl-stop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:10px;background:#FBF3E2;border:1px solid var(--amber)}
  .pl-stop.dragging{opacity:.4}
  .pl-stop.drop-before{box-shadow:inset 0 3px 0 var(--pine)}
  .pl-stop.drop-after{box-shadow:inset 0 -3px 0 var(--pine)}
  .pl-grip{cursor:grab;color:var(--amber-deep);font-size:16px;user-select:none;flex:none;width:18px;text-align:center}
  .pl-name{flex:1 1 120px;min-width:0;font-weight:700;font-size:15px;color:var(--pine);text-decoration:none;display:flex;flex-direction:column;justify-content:center;min-height:40px}
  .pl-name small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
  a.pl-name:hover span{text-decoration:underline}
  .pl-name.noa{cursor:default}
  .pl-name span{overflow-wrap:anywhere}
  .pl-tag{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
  .pl-name .pl-tag{display:block}
  .pl-free{min-height:64px;margin-top:10px}
  .pl-rough{padding:8px 10px;border-radius:8px;background:#FBF3E2;border:1px solid var(--amber);color:var(--ink)}
  .pl-pend{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
  .pl-pick{border:1px solid var(--amber);background:#FBF3E2;border-radius:10px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
  .pl-pick p{margin:0 0 6px}
  .pl-pickbtns{display:flex;flex-wrap:wrap;gap:8px}
  .pl-pickbtns .qrbtn,.pl-pickbtns .linkbtn{min-height:40px;text-align:left;max-width:100%}
  .pl-pickbtns .qrbtn{border-radius:14px}
  .pl-lookup{min-height:0;margin:8px 0 0;font-size:14px;color:var(--pine);font-weight:600;overflow-wrap:anywhere}
  .pl-lookup:empty{display:none}
  .pl-ctl{display:inline-flex;align-items:center;gap:4px}
  .pl-ctl button{min-width:40px;min-height:40px;border:1.5px solid var(--border);background:var(--card);color:var(--pine);border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;line-height:1}
  .pl-ctl button:hover:not([disabled]){border-color:var(--pine2)}
  .pl-ctl button[disabled]{opacity:.35;cursor:not-allowed}
  .pl-ctl output{min-width:62px;text-align:center;font-family:var(--mono);font-size:13px}
  .pl-ctl.mv{margin-left:auto}
  .pl-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pl-empty{color:var(--muted);font-style:italic;font-size:14px;margin:14px 0 6px}
  .pl-dates{list-style:none;margin:14px 0 0;padding:0}
  .pl-dates li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:15px;flex-wrap:wrap}
  .pl-dates li:first-child{border-top:none}
  .pl-dates b{font-family:var(--mono);font-size:14px;color:var(--amber-deep)}
  .pl-fly{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:14px}
  .pl-fly .ip input{width:90px;min-height:30px;font-size:16px}
  .pl-fly select{min-height:44px;font-size:15px;border:1.5px solid var(--border);border-radius:8px;background:var(--paper);padding:4px 8px}
  .pl-fly .assume label{text-transform:uppercase}
  .pl-note{font-size:13px;color:var(--muted);margin:0 0 10px}
  .pl-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pl-mode{display:block;text-align:left;font-family:var(--sans);color:var(--ink);cursor:pointer;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:12px;min-height:44px}
  .pl-mode[aria-pressed="true"]{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine) inset;background:#F4F8F2}
  .pl-mode[disabled]{opacity:.55;cursor:not-allowed}
  .pl-mode span{display:block}
  .pl-mode .m{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:var(--muted)}
  .pl-mode .t{font-family:var(--mono);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
  .pl-mode .b{font-size:.78rem;color:var(--muted);line-height:1.4}
  .pl-mode .win{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#2e9e5b;border-radius:100px;padding:2px 9px}
  .pl-verdict{margin:10px 0 0;font-size:15px;font-weight:600}
  @media(max-width:520px){.pl-modes{grid-template-columns:1fr}}
  .pl-bar{position:sticky;bottom:0;z-index:5;margin:0 -24px;padding:10px 24px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--pine);
    display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
  @media(max-width:520px){.pl-bar{margin:0 -16px;padding-left:16px;padding-right:16px}}
  .pl-tot{font-size:13px;color:var(--muted);line-height:1.25}
  .pl-tot b{display:block;font-family:var(--mono);font-size:20px;color:var(--amber-deep);font-variant-numeric:tabular-nums}
  .pl-nav{display:flex;gap:8px}
  .pl-assume{font-size:13px;color:var(--muted);margin:14px 0 0}
  .pl-assume .linkbtn{min-height:40px;font-size:13px;text-decoration:underline}
  .pl-link{display:inline-block;min-height:40px;line-height:40px}
  .pl-parent{margin:14px 0 0;padding:12px;border-radius:10px;background:var(--paper);border:1px dashed var(--border);font-size:14px}
  .pl-save{width:100%;margin-top:14px;justify-content:center}
  .ag{margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--border)}
  .ag h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 2px}
  .ag h4{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--pine);margin:16px 0 6px;overflow-wrap:anywhere}
  .ag h4 small{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--muted)}
  .ag-prog{list-style:none;margin:10px 0 0;padding:0;font-size:14px;color:var(--pine)}
  .ag-prog li{padding:4px 0;overflow-wrap:anywhere}
  .ag-prog li.wait{color:var(--muted)}
  .ag-prog li:before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;border:2px solid var(--amber-deep);border-top-color:transparent;animation:agspin 1s linear infinite;vertical-align:-1px}
  .ag-prog li.wait:before{animation:none;border-color:var(--border)}
  @keyframes agspin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.ag-prog li:before{animation:none}}
  .ag-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ag-card{border:1px solid var(--border);border-radius:10px;background:var(--paper);padding:10px 12px;min-width:0}
  .ag-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline}
  .ag-name{font-size:15px;color:var(--pine);overflow-wrap:anywhere;min-width:0}
  .ag-price{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--amber-deep);white-space:nowrap}
  .ag-price small{font-size:11px;font-weight:400;color:var(--muted)}
  .ag-meta{font-size:12.5px;color:var(--muted);margin:2px 0 0;overflow-wrap:anywhere}
  .ag-why{font-size:14px;margin:6px 0 0;overflow-wrap:anywhere}
  .ag-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .ag-btns .qrbtn{min-height:40px;display:inline-flex;align-items:center;text-decoration:none}
  .ag-notes{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#FBF3E2;border:1px solid var(--amber);overflow-wrap:anywhere}
  .ag-found{font-size:12.5px;color:var(--muted);margin:6px 0 0}
  .ag .pl-err .linkbtn,.ag .pl-err .qrbtn{min-height:40px;margin-top:6px}
  .pl-ovr{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#F4F8F2;border:1px solid var(--pine2);font-size:14px}
  .pl-ovr ul{list-style:none;margin:6px 0 0;padding:0}
  .pl-ovr li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;justify-content:space-between;padding:2px 0;overflow-wrap:anywhere}
  .pl-ovr .linkbtn{min-height:40px;text-decoration:underline;font-size:13px}
</style>
</head>
<body>
<div id="atlas-chrome"></div>
<main id="app" class="wrap ac-main"></main>
<script src="/atlas/atlas-core.js"></script>
<script>
Atlas.mountChrome('plan');
(function(){
  var E = Atlas.esc, money = Atlas.money, app = document.getElementById('app');
  var STEPS = [['where','Where'],['when','When'],['how','How'],['save','Cost & save']];
  var DRAFT_KEY = 'atlas_draft', FARE_KEY = 'atlas_draft_fare', RATES_KEY = 'atlas_draft_rates';
  var MAX_STOPS = 20;

  /* ---------- state ---------- */
  function blank(){ return { name:'', start_date:null, stops:[], mode:'drive', notes:'' }; }
  var S = {
    step: 0, draft: blank(), fare: { dep:'GSP', airfare:0 }, fareNote:'', fareBusy:false,
    saveErr:'', saving:false, done:false, msg:'', focus:null, focusHeading:false,
    tf: { budget:2000, nights:4, results:null, open:false }, dragIdx:null,
    free: { text:'', busy:false, status:'', pending:[] },   // "Add any city": field text, lookup status, entries awaiting a choice
    rates: {},                                  // searched hotel rates for this draft: { city: {rate, name, source, url} }
    ag: { res:{}, needDate:'', origin:null }    // travel agent: per-request status, date prompt, flight origin pinned at search time
  };

  /* ---------- storage (always guarded) ---------- */
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
  function isDate(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  // Atlas stops keep only {city, nights} (as always). A stop flagged custom is kept with its optional
  // lat/lon, and every custom stop is registered with the core so costs can use it.
  function cleanStops(arr){
    var C = Atlas.data.COORDS || {}, out = [];
    (Array.isArray(arr) ? arr : []).forEach(function(s){
      if (!s || typeof s.city !== 'string') return;
      if (C[s.city]) { out.push({ city:s.city, nights:clampN(s.nights) }); return; }
      var name = s.city.trim().replace(/\s+/g, ' ');
      if (s.custom !== true || !name || name.length > 80) return;
      var st = { city:name, nights:clampN(s.nights) };
      if (validPos(s.lat, s.lon)) { st.lat = s.lat; st.lon = s.lon; }
      st.custom = true; out.push(st);
    });
    out = out.slice(0, MAX_STOPS);
    Atlas.registerStops(out);
    return out;
  }
  function validPos(lat, lon){
    return typeof lat === 'number' && typeof lon === 'number' && isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  }
  function clampN(n){ n = Math.round(parseFloat(n)); return isFinite(n) ? Math.min(30, Math.max(0, n)) : 0; }
  function loadDraft(){
    var d = blank();
    try {
      var j = JSON.parse(lsGet(DRAFT_KEY));
      if (j && typeof j === 'object') {
        if (j.id != null) d.id = j.id;
        d.name = typeof j.name === 'string' ? j.name : '';
        d.start_date = isDate(j.start_date) ? j.start_date : null;
        d.stops = cleanStops(j.stops);
        d.mode = j.mode === 'fly' ? 'fly' : 'drive';
        d.notes = typeof j.notes === 'string' ? j.notes : '';
      }
    } catch(e){}
    try {
      var f = JSON.parse(lsGet(FARE_KEY));
      if (f && typeof f === 'object') {
        var codes = Atlas.DEP_OPTS.map(function(o){ return o[0]; });
        S.fare = { dep: codes.indexOf(f.dep) >= 0 ? f.dep : 'GSP', airfare: Math.max(0, parseFloat(f.airfare) || 0) };
      }
    } catch(e){}
    S.rates = {};
    try {
      var rj = JSON.parse(lsGet(RATES_KEY)), C = Atlas.data.COORDS || {};
      if (rj && typeof rj === 'object') Object.keys(rj).forEach(function(city){
        var r = rj[city], n = r && parseFloat(r.rate);
        if ((C[city] || d.stops.some(function(s){ return s.city === city; })) && n > 0 && n <= 5000) S.rates[city] = { rate:n, name:String(r.name || '').slice(0, 120), source:String(r.source || '').slice(0, 60),
          url:/^https?:\/\//i.test(r.url || '') ? String(r.url).slice(0, 800) : '' };
      });
    } catch(e){}
    return d;
  }
  function persist(){
    if (S.done) return;
    lsSet(DRAFT_KEY, JSON.stringify(S.draft));
    lsSet(FARE_KEY, JSON.stringify(S.fare));
    lsSet(RATES_KEY, JSON.stringify(S.rates));
  }
  function clearDraft(){ S.done = true; lsDel(DRAFT_KEY); lsDel(FARE_KEY); lsDel(RATES_KEY); }

  /* ---------- derived ---------- */
  function stops(){ return S.draft.stops; }
  // Searched hotel rates that apply to the stops currently in the trip.
  function ratesInUse(){
    return stops().filter(function(s){ return S.rates[s.city] && S.rates[s.city].rate > 0; })
      .map(function(s){ return { city:s.city, r:S.rates[s.city] }; });
  }
  function rateMap(){ var m = {}; ratesInUse().forEach(function(x){ m[x.city] = x.r.rate; }); return m; }
  function trip(){
    if (!stops().length) return null;
    try { return Atlas.tripCost(stops(), { hotelRates:rateMap() }); } catch(e){ return null; }
  }
  function fly(t){
    if (!t) return null;
    try { return Atlas.flyCost({ stops:stops(), dep:S.fare.dep, airfare:S.fare.airfare, trip:t }); } catch(e){ return null; }
  }
  function totals(){
    var t = trip(), f = fly(t);
    var total = !t ? 0 : (S.draft.mode === 'fly' && f ? f.flyTotal : t.total);
    return { t:t, f:f, total:total };
  }
  function autoName(){
    var c = stops().map(function(s){ return s.city; });
    var n;
    if (!c.length) n = 'My trip';
    else if (c.length === 1) n = c[0] + ' trip';
    else n = c.slice(0, -1).join(', ') + ' & ' + c[c.length - 1] + ' trip';
    return n.length > 80 ? n.slice(0, 77) + '…' : n;
  }
  function parseISO(s){
    if (!isDate(s)) return null;
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }

  /* ---------- mutations ---------- */
  function changed(){ persist(); render(); }
  function addCity(city){
    if (stops().length >= MAX_STOPS) return 'Trips are limited to ' + MAX_STOPS + ' stops.';
    if (!(Atlas.data.COORDS || {})[city] || !(Atlas.data.CITIES || {})[city]) return null;
    if (stops().some(function(s){ return s.city === city; })) return 'dup';
    stops().push({ city:city, nights:clampN(Atlas.settings.get().nights) });
    return 'ok';
  }
  function move(i, j){
    var a = stops();
    if (j < 0 || j >= a.length || i === j) return;
    a.splice(j, 0, a.splice(i, 1)[0]);
  }
  // A place that is not in the Atlas: { city, lat?, lon? }. Stored as {city, nights, lat, lon, custom:true}.
  function addCustomStop(p){
    if (stops().length >= MAX_STOPS) return 'Trips are limited to ' + MAX_STOPS + ' stops.';
    if (stops().some(function(s){ return s.city === p.city; })) return 'dup';
    var st = { city:p.city, nights:clampN(Atlas.settings.get().nights) };
    if (validPos(p.lat, p.lon)) { st.lat = Math.round(p.lat * 10000) / 10000; st.lon = Math.round(p.lon * 10000) / 10000; }
    st.custom = true;
    stops().push(st);
    Atlas.addCustomCity(st.city, st);
    return 'ok';
  }

  /* ---------- "Add any city": Open-Meteo geocoding (no key; only the city text is sent) ---------- */
  var GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search';
  var GEO_TIMEOUT = 8000, MAX_ENTRIES = 10;
  var US_STATES = { AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado', CT:'Connecticut', DE:'Delaware', DC:'District of Columbia',
    FL:'Florida', GA:'Georgia', HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana', ME:'Maine', MD:'Maryland',
    MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri', MT:'Montana', NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey',
    NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota', OH:'Ohio', OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina',
    SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont', VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming' };
  var CA_PROVS = { AB:'Alberta', BC:'British Columbia', MB:'Manitoba', NB:'New Brunswick', NL:'Newfoundland and Labrador', NS:'Nova Scotia', NT:'Northwest Territories',
    NU:'Nunavut', ON:'Ontario', PE:'Prince Edward Island', QC:'Quebec', SK:'Saskatchewan', YT:'Yukon' };
  var COUNTRY_ALIAS = { us:'US', usa:'US', 'united states':'US', 'united states of america':'US', america:'US', uk:'GB', 'united kingdom':'GB', 'great britain':'GB', britain:'GB',
    uae:'AE', holland:'NL', 'south korea':'KR', korea:'KR', czechia:'CZ', 'czech republic':'CZ', 'new zealand':'NZ' };
  // Names only used to recognise "Paris, France" style qualifiers; matching against results uses the API's own country field.
  var COUNTRY_NAMES = ('Argentina|Australia|Austria|Bahamas|Barbados|Belgium|Belize|Bermuda|Bolivia|Brazil|Bulgaria|Cambodia|Canada|Chile|China|Colombia|Costa Rica|Croatia|Cuba|Cyprus|' +
    'Czechia|Czech Republic|Denmark|Dominican Republic|Ecuador|Egypt|El Salvador|England|Estonia|Fiji|Finland|France|Germany|Ghana|Greece|Guatemala|Honduras|Hungary|Iceland|India|' +
    'Indonesia|Ireland|Israel|Italy|Jamaica|Japan|Jordan|Kenya|Korea|Latvia|Lithuania|Malaysia|Malta|Mexico|Monaco|Morocco|Nepal|Netherlands|New Zealand|Nicaragua|Northern Ireland|' +
    'Norway|Panama|Peru|Philippines|Poland|Portugal|Puerto Rico|Romania|Scotland|Singapore|Slovakia|Slovenia|South Africa|South Korea|Spain|Sweden|Switzerland|Taiwan|Tanzania|Thailand|' +
    'Trinidad and Tobago|Turkey|Uganda|Ukraine|United Arab Emirates|United Kingdom|United States|Uruguay|Venezuela|Vietnam|Wales|Holland|Great Britain|America').split('|');

      (f.winner === 'fly' ? '<span class="win">Cheaper</span>' : '') + '</button>';

  }
  function howHTML(){

      '<div class="assume"><label for="pl-fare">Airfare, whole party</label><div class="ip"><span>$</span><input id="pl-fare" type="number" inputmode="decimal" step="10" min="0" placeholder="0" value="' + (S.fare.airfare > 0 ? E(S.fare.airfare) : '') + '"></div></div>' +
      '<button type="button" class="qrbtn pl-btn" data-act="fare"' + (S.fareBusy ? ' disabled' : '') + '>Look up fares</button></div>' +
      '<p class="pl-note" id="pl-farenote" role="status" aria-live="polite">' + E(S.fareNote) + '</p>' +
      '<div id="pl-compare">' + compareHTML() + '</div>' + ratesHTML() + agentHTML();
  }
  function saveHTML(){
    var x = totals(), t = x.t, f = x.f, d = S.draft;
    if (!t) return '';
    function row(label, val, cls){ return '<div class="ts-row' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><b>' + E(money(val)) + '</b></div>'; }
    var rows, lodgeTag = ratesInUse().length ? ' · searched rates' : '';
    if (d.mode === 'fly' && f) {
      var sub = f.airfare + f.toAirport + f.rental + f.localGas + f.lodge + f.food;
      rows = row('Airfare' + (f.airfare > 0 ? '' : ' (not entered)'), f.airfare) +
        (f.toAirport > 0 ? row('Drive to ' + E(f.dep), f.toAirport) : '') +
        row('Rental car (' + plural(f.days, 'day') + ')', f.rental) + row('Local gas', f.localGas) +

    } else {

        row('Food (' + plural(t.days, 'day') + ')', t.food) + row('Subtotal', t.subtotal, 'sub') + row('Buffer (' + E(t.pct) + '%)', t.buffer) + row('Total, driving', t.total, 'total');

      '<div class="tripsummary">' + rows + '</div>' + driveNotes() + ratesHTML() +
      (d.mode === 'fly' && f && f.airfare <= 0 ? '<p class="pl-note">No airfare entered, so this fly total leaves flights out. Add one in step 3.</p>' : '') +
      '<label class="pl-lab" for="pl-name">Trip name</label><input class="pl-text" id="pl-name" type="text" maxlength="80" value="' + E(d.name || autoName()) + '">' +
      '<label class="pl-lab" for="pl-notes">Notes (optional)</label><textarea class="pl-area" id="pl-notes" maxlength="2000">' + E(d.notes) + '</textarea>' +
      (parent
        ? '<button type="button" class="qrbtn solid pl-btn pl-save" data-act="save"' + (S.saving ? ' disabled' : '') + '>' + (S.saving ? 'Saving…' : (d.id ? 'Save changes' : 'Save trip')) + '</button>'
        : '<p class="pl-parent">A parent needs to be signed in on the Planner to save trips. Your draft is kept on this device.</p>') +
      '<div id="pl-saveerr" role="alert">' + (S.saveErr ? '<p class="pl-err">' + E(S.saveErr) + '</p>' : '') + '</div>';
  }
  function assumeLine(){
    var s = Atlas.settings.get();
    return '<p class="pl-assume">Assumptions: hotel ' + E(money(s.hotel)) + '/night where no rate is researched · gas ' + E(money(s.gas)) + ' at ' + E(s.mpg) + ' mpg · food ' + E(money(s.food)) +
      '/day · ' + E(s.adults) + ' adult' + (s.adults === 1 ? '' : 's') + ', ' + E(s.kids) + ' kid' + (s.kids === 1 ? '' : 's') +
      ' <button type="button" class="linkbtn" data-act="settings">Change</button></p>';
  }
  function barHTML(){
    var x = totals(), n = stops().length, nights = x.t ? x.t.totalNights : 0;
    var back = S.step > 0 ? '<button type="button" class="qrbtn pl-btn" data-act="back">Back</button>' : '';
    var next = S.step < STEPS.length - 1 ? '<button type="button" class="qrbtn solid pl-btn" data-act="next"' + (n ? '' : ' disabled') + '>Next: ' + E(STEPS[S.step + 1][1]) + '</button>' : '';
    return '<div class="pl-bar"><div class="pl-tot">' + plural(n, 'stop') + ' · ' + plural(nights, 'night') + (S.draft.mode === 'fly' ? ' · flying' : '') +
      '<b id="pl-total">' + (n ? E(money(x.total)) : '$0') + '</b></div><div class="pl-nav">' + back + next + '</div></div>';
  }
  function render(){
    var body = [whereHTML, whenHTML, howHTML, saveHTML][S.step]();
    app.innerHTML = '<h1 class="page-title">Plan a trip</h1>' + stepperHTML() +
      '<p class="sr-only" id="pl-live" role="status" aria-live="polite">Step ' + (S.step + 1) + ' of 4: ' + E(STEPS[S.step][1]) + '</p>' +
      '<p class="pl-msg" id="pl-msg" role="status" aria-live="polite">' + E(S.msg) + '</p>' +
      '<section class="pl-card">' + body + '</section>' + barHTML() + assumeLine();
    if (S.focusHeading) { var h = document.getElementById('pl-h'); if (h) h.focus(); S.focusHeading = false; }
    else if (S.focus) {
      for (var i = 0; i < S.focus.length; i++) { var el = app.querySelector(S.focus[i]); if (el && !el.disabled) { el.focus(); break; } }
    }
    S.focus = null;
  }
  function setMsg(m){ S.msg = m; var el = document.getElementById('pl-msg'); if (el) el.textContent = m; }
  function goStep(i){
    if (i < 0 || i >= STEPS.length) return;
    if (i > 0 && !stops().length) return;
    S.step = i; S.focusHeading = true; S.saveErr = ''; render();
    try { window.scrollTo(0, 0); } catch(e){}
  }
  function updateCompare(){
    var c = document.getElementById('pl-compare'); if (c) c.innerHTML = compareHTML();
    var n = document.getElementById('pl-farenote'); if (n) n.textContent = S.fareNote;
    var t = document.getElementById('pl-total'); if (t) t.textContent = stops().length ? money(totals().total) : '$0';
  }

  /* ---------- fare lookup (same query as the old page) ---------- */
  async function fetchFare(){
    var far = Atlas.farthestStop(stops());
    if (!far) { S.fareNote = 'Add a stop first.'; return updateCompare(); }
    if (!far.airport) { S.fareNote = 'No airport mapped for ' + far.city + '. Enter airfare by hand.'; return updateCompare(); }
    var sv = S.draft.start_date;
    if (!sv) { S.fareNote = 'Set a trip start date in step 2 to look up fares.'; return updateCompare(); }
    var totalNights = stops().reduce(function(s, x){ return s + x.nights; }, 0);
    var start = parseISO(sv), ret = new Date(start); ret.setDate(ret.getDate() + Math.max(1, totalNights));
    var st = Atlas.settings.get(), adults = Math.max(1, Math.round(st.adults)), kids = Math.max(0, Math.round(st.kids));
    var gas = st.gas, mpg = st.mpg || 25;
    S.fareBusy = true; S.fareNote = 'Searching GSP, ATL & CLT…'; render();
    try {
      var results = await Promise.all(Atlas.DEP_OPTS.map(async function(o){
        var code = o[0];
        try {
          var q = '/api/atlas/flights?from=' + code + '&to=' + far.airport + '&depart=' + sv + '&return=' + Atlas.isoDate(ret) + '&adults=' + adults + '&children=' + kids;
          var r = await Atlas.fetch(q), d = await r.json();
          var cash = d && d.bestCash && d.bestCash.effectiveUsd;
          return { code:code, cash:(typeof cash === 'number' ? cash : null), d:d };
        } catch(_) { return { code:code, cash:null }; }
      }));
      var priced = results.filter(function(x){ return x.cash != null; });
      if (!priced.length) {
        var d0 = (results[0] || {}).d;
        if (d0 && d0.sources && d0.sources.serpapi && d0.sources.serpapi.configured === false && d0.sources.kiwi && d0.sources.kiwi.configured === false)
          S.fareNote = 'Live fares are not set up yet. Enter airfare by hand.';
        else S.fareNote = 'No fares found. Enter airfare by hand.';
      } else {
        priced.forEach(function(x){ x.net = x.cash + Atlas.airportDriveFuel(x.code, gas, mpg); });
        priced.sort(function(a, b){ return a.net - b.net; });
        var best = priced[0];
        S.fare.dep = best.code; S.fare.airfare = Math.round(best.cash);
        var others = priced.slice(1).map(function(x){ return x.code + ' ' + money(x.cash); }).join(' · ');
        S.fareNote = 'Cheapest net: ' + best.code + ' ' + money(best.cash) + ' for ' + (adults + kids) + (others ? ' · vs ' + others : '');
        persist();
      }
    } catch(e) { S.fareNote = 'Fare lookup failed. Enter airfare by hand.'; }
    S.fareBusy = false; render();
  }

  /* ---------- travel agent (parents only; one model request per stop + one for flights) ---------- */
  var AG_CACHE_KEY = 'atlas_agent_cache', AG_MAX = 3, AG_TIMEOUT = 75000, AG_KEEP = 30;
  var agCache = {};                  // request key -> { data, at }
  var agRun = { active: 0, queue: [] };
  function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
  function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
  function agLoadCache(){
    try { var j = JSON.parse(ssGet(AG_CACHE_KEY)); if (j && typeof j === 'object' && !Array.isArray(j)) agCache = j; } catch(e){}
  }
  function agSaveCache(){
    var keys = Object.keys(agCache);
    if (keys.length > AG_KEEP) {
      keys.sort(function(a, b){ return (agCache[a].at || 0) - (agCache[b].at || 0); }).slice(0, keys.length - AG_KEEP).forEach(function(k){ delete agCache[k]; });
    }
    ssSet(AG_CACHE_KEY, JSON.stringify(agCache));
  }
  function fnum(v){ return typeof v === 'number' && isFinite(v) ? v : null; }
  function clampI(n, lo, hi){ n = Math.round(n); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo; }
  function safeHref(u){ return typeof u === 'string' && /^https?:\/\//i.test(u) ? E(u) : ''; }
  function agOrigin(){ return S.ag.origin || S.fare.dep; }

  // The requests the current trip implies: flights first (so it starts at once), then one per stop with a night.
  function agRequests(){
    var sv = S.draft.start_date, a = stops();
    if (!sv || !a.length) return [];
    var st = Atlas.settings.get(), adults = clampI(st.adults, 1, 8), kids = clampI(st.kids, 0, 8);
    var start = parseISO(sv), cum = 0, hotels = [], flight = null;
    a.forEach(function(s){
      if (s.nights > 0) {
        var ci = new Date(start); ci.setDate(ci.getDate() + cum);
        var co = new Date(ci); co.setDate(co.getDate() + s.nights);
        var body = { task:'hotels', city:s.city, checkin:Atlas.isoDate(ci), checkout:Atlas.isoDate(co), adults:adults, kids:kids };
        hotels.push({ kind:'hotels', city:s.city, body:body, key:JSON.stringify(body), ci:ci, co:co, nights:s.nights });
      }
      cum += s.nights;
    });
    var far = Atlas.farthestStop(a);
    if (far) {
      var ret = new Date(start); ret.setDate(ret.getDate() + Math.max(1, cum));
      var fb = { task:'flights', from:agOrigin(), toCity:far.city, depart:sv, 'return':Atlas.isoDate(ret), adults:adults, kids:kids };
      flight = { kind:'flights', city:far.city, body:fb, key:JSON.stringify(fb), ci:start, co:ret };
    }
    return (flight ? [flight] : []).concat(hotels);
  }
  function agState(r){
    var x = S.ag.res[r.key];
    if (x && (x.status === 'queued' || x.status === 'loading' || x.status === 'error')) return x.status;
    return agCache[r.key] ? 'done' : 'idle';
  }
  function agLabel(r){
    return r.kind === 'flights' ? 'flights ' + r.body.from + ' to ' + r.city : 'hotels in ' + r.city;
  }
  function agErr(status, data){
    var msg = data && typeof data.error === 'string' ? data.error.slice(0, 200) : '';
    if (status === 401) return { kind:'signedout', fatal:true, msg:'Please sign in on the Planner first, then try again.' };
    if (status === 403) return { kind:'parents', fatal:true, msg:'Only parents can use the travel agent.' };
    if (status === 503 && data && (data.detail === 'ANTHROPIC_API_KEY is not configured' || /not set up/i.test(msg)))
      return { kind:'setup', fatal:true, msg:'The travel agent is not set up yet. A parent needs to add the Anthropic API key in the site settings.' };
    if (!data && (status === 404 || status === 405)) return { kind:'unavailable', fatal:true, msg:'The travel agent is not available on this copy of the site. It runs on the live site.' };
    if (status === 400) return { kind:'bad', retry:false, msg:msg || 'That search was not accepted. Check the trip dates and stops.' };
    if (status === 422) return { kind:'declined', retry:true, msg:msg || 'The travel agent could not answer that search.' };
    if (status === 429) return { kind:'busy', retry:true, msg:'The travel agent is busy right now. Wait a minute, then try again.' };
    if (status === 504) return { kind:'timeout', retry:true, msg:'That search took too long. Try again.' };
    return { kind:'upstream', retry:true, msg:'The travel agent ran into a problem. Try again.' };
  }
  function agPress(force){
    if (!Atlas.auth.parent || !stops().length) return;
    var sv = S.draft.start_date;
    if (!sv) { S.ag.needDate = 'none'; return renderAgent(); }
    if (sv < Atlas.isoDate(new Date())) { S.ag.needDate = 'past'; return renderAgent(); }
    S.ag.needDate = '';
    if (!S.ag.origin) S.ag.origin = S.fare.dep;
    var run = [];
    agRequests().forEach(function(r){
      var st = agState(r);
      if (st === 'loading' || st === 'queued') return;
      if (force) { delete agCache[r.key]; run.push(r); }
      else if (st !== 'done') run.push(r);
    });
    if (force) agSaveCache();
    run.forEach(function(r){ S.ag.res[r.key] = { status:'queued' }; agRun.queue.push(r); });
    agPump(); renderAgent();
  }
  function agPump(){
    while (agRun.active < AG_MAX && agRun.queue.length) { agRun.active++; agSend(agRun.queue.shift()); }
  }
  async function agSend(r){
    S.ag.res[r.key] = { status:'loading' }; renderAgent();
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, AG_TIMEOUT) : null;
    var out;
    try {
      var resp = await Atlas.fetch('/api/atlas/agent', {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(r.body), signal:ctrl ? ctrl.signal : undefined
      });
      var data = null; try { data = await resp.json(); } catch(e){}
      if (resp.ok && data && Array.isArray(data.options)) { agCache[r.key] = { data:data, at:Date.now() }; agSaveCache(); out = { status:'done' }; }
      else out = { status:'error', err:agErr(resp.status, data) };
    } catch(e) {
      out = { status:'error', err:(e && e.name === 'AbortError')
        ? { kind:'timeout', retry:true, msg:'That search took too long. Try again.' }
        : { kind:'network', retry:true, msg:'Could not reach the travel agent. Check your connection and try again.' } };
    }
    if (timer) clearTimeout(timer);
    S.ag.res[r.key] = out;
    agRun.active--;
    if (out.status === 'error' && out.err.fatal) {
      // Same answer would come back for every queued search; skip them rather than spend or spam.
      agRun.queue.splice(0).forEach(function(q){ S.ag.res[q.key] = { status:'error', err:out.err }; });
    }
    agPump(); renderAgent();
  }

  function agSecHead(r){
    var span = r.ci && r.co ? Atlas.fmtRange(r.ci, r.co) : '';
    if (r.kind === 'flights') return '<h4>Flights · ' + E(r.body.from) + ' to ' + E(r.city) + ' <small>' + E(span) + ' · ' + E(r.body.adults + r.body.kids) + ' travellers</small></h4>';
    return '<h4>' + E(r.city) + ' <small>' + E(span) + ' · ' + plural(r.nights, 'night') + '</small></h4>';
  }
  function agFound(data){
    var d = data && typeof data.researchedAt === 'string' ? new Date(data.researchedAt) : null;
    var when = d && !isNaN(d) ? d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';
    return '<p class="ag-found">' + (when ? 'Prices found ' + E(when) + ', ' : '') + 'check before booking. Nothing is booked from here.</p>';
  }
  function agHotelCards(r, idx, data){
    var opts = (data.options || []).slice(0, 5), cur = S.rates[r.city];
    return '<ul class="ag-list">' + opts.map(function(o, k){
      if (!o || typeof o !== 'object') return '';
      var n = fnum(o.nightly), tot = fnum(o.total), href = safeHref(o.url), inUse = cur && n != null && cur.rate === n && cur.url === o.url;
      return '<li class="ag-card"><div class="ag-top"><b class="ag-name">' + E(o.name) + '</b><span class="ag-price">' +
          (n != null ? E(money(n)) + '<small>/night</small>' : '<small>rate not found</small>') + '</span></div>' +
        '<p class="ag-meta">' + [o.area ? E(o.area) : '', tot != null ? 'stay ' + E(money(tot)) : '', o.source ? E(o.source) : ''].filter(Boolean).join(' · ') + '</p>' +
        (o.why ? '<p class="ag-why">' + E(o.why) + '</p>' : '') +
        '<div class="ag-btns">' + (href ? '<a class="qrbtn" href="' + href + '" target="_blank" rel="noopener">View hotel ↗</a>' : '') +
        '<button type="button" class="qrbtn solid" data-act="ag-rate" data-i="' + idx + '" data-o="' + k + '"' + (n == null || inUse ? ' disabled' : '') + '>' + (inUse ? 'Using this rate' : 'Use this rate') + '</button></div></li>';
    }).join('') + '</ul>';
  }
  function agFlightCards(r, idx, data){
    var opts = (data.options || []).slice(0, 5);
    return '<ul class="ag-list">' + opts.map(function(o, k){
      if (!o || typeof o !== 'object') return '';
      var tot = fnum(o.priceTotal), pp = fnum(o.pricePerPerson), href = safeHref(o.url);
      var stopsTxt = fnum(o.stops) == null ? '' : o.stops === 0 ? 'nonstop' : plural(o.stops, 'stop');
      var inUse = tot != null && Math.round(tot) === S.fare.airfare && S.draft.mode === 'fly';
      return '<li class="ag-card"><div class="ag-top"><b class="ag-name">' + E(o.airline) + ' · ' + E(o.from) + ' → ' + E(o.to) + '</b><span class="ag-price">' +
          (tot != null ? E(money(tot)) + '<small> total</small>' : '<small>price not found</small>') + '</span></div>' +
        '<p class="ag-meta">' + [o.depart && o.return ? E(o.depart) + ' to ' + E(o.return) : '', stopsTxt, o.duration ? E(o.duration) : '', pp != null ? E(money(pp)) + ' each' : '', o.source ? E(o.source) : ''].filter(Boolean).join(' · ') + '</p>' +
        (o.label ? '<p class="ag-why">' + E(o.label) + '</p>' : '') +
        '<div class="ag-btns">' + (href ? '<a class="qrbtn" href="' + href + '" target="_blank" rel="noopener">View flight ↗</a>' : '') +
        '<button type="button" class="qrbtn solid" data-act="ag-fare" data-i="' + idx + '" data-o="' + k + '"' + (tot == null || inUse ? ' disabled' : '') + '>' + (inUse ? 'Using this fare' : 'Use this fare') + '</button></div></li>';
    }).join('') + '</ul>';
  }
  function agentInner(){
    var reqs = agRequests(), busy = false, anyRes = false, prog = '', secs = '';
    reqs.forEach(function(r, idx){
      var st = agState(r), x = S.ag.res[r.key];
      if (st === 'queued' || st === 'loading') {
        busy = true;
        prog += st === 'loading' ? '<li>Searching ' + E(agLabel(r)) + '…</li>' : '<li class="wait">Waiting to search ' + E(agLabel(r)) + '</li>';
        return;
      }
      if (st === 'error') {
        secs += agSecHead(r) + '<div role="alert" class="pl-err">' + E(x.err.msg) +
          (x.err.retry ? '<br><button type="button" class="qrbtn pl-btn" data-act="ag-retry" data-i="' + idx + '">Try again</button>' : '') + '</div>';
        return;
      }
      if (st === 'done') {
        anyRes = true;
        var data = agCache[r.key].data, n = Array.isArray(data.options) ? data.options.length : 0;
        secs += agSecHead(r) + (n
          ? (r.kind === 'flights' ? agFlightCards(r, idx, data) : agHotelCards(r, idx, data))
          : '<p class="pl-empty">No ' + (r.kind === 'flights' ? 'flights' : 'hotels') + ' found for these dates.</p>') +
          (data.notes ? '<p class="ag-notes">' + E(data.notes) + '</p>' : '') + agFound(data) +
          (n ? '' : '<button type="button" class="qrbtn pl-btn" data-act="ag-retry" data-i="' + idx + '">Search again</button>');
      }
    });
    var need = S.ag.needDate
      ? '<p class="pl-err" role="alert">' + (S.ag.needDate === 'past' ? 'The trip start date has already passed, so there is nothing to search.' : 'Set a trip start date first, so the agent knows which dates to search.') +
        '<br><button type="button" class="qrbtn pl-btn" data-act="ag-gowhen">Go to the When step</button></p>' : '';
    return '<h3>Find hotels &amp; flights</h3>' +
      '<p class="pl-note">Claude searches the live web for hotels at each stop and for flights. Each search can take up to a minute and uses the family API account. You can keep using the page while it works. Nothing is booked.</p>' +
      '<div class="pl-actions"><button type="button" class="qrbtn solid pl-btn" data-act="agent"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Searching…' : 'Find hotels &amp; flights') + '</button>' +
      (anyRes && !busy ? '<button type="button" class="qrbtn pl-btn" data-act="agent-again">Search again</button>' : '') + '</div>' +
      need + (prog ? '<ul class="ag-prog" role="status" aria-live="polite">' + prog + '</ul>' : '') + secs;
  }
  function agentHTML(){
    return Atlas.auth.parent ? '<div class="ag" id="pl-agent">' + agentInner() + '</div>' : '';
  }
  function renderAgent(){
    var el = document.getElementById('pl-agent'); if (!el) return;
    var ae = document.activeElement, sel = null;
    if (ae && ae.getAttribute && el.contains(ae)) {
      var a = ae.getAttribute('data-act'), i = ae.getAttribute('data-i'), o = ae.getAttribute('data-o');
      if (a) sel = '[data-act="' + a + '"]' + (i != null ? '[data-i="' + i + '"]' : '') + (o != null ? '[data-o="' + o + '"]' : '');
    }
    el.innerHTML = agentInner();
    if (sel) { var n = el.querySelector(sel); if (n && !n.disabled) n.focus(); }
  }
  function useRate(i, k){
    var r = agRequests()[i], c = r && agCache[r.key], o = c && c.data.options && c.data.options[k];
    var n = o && fnum(o.nightly);
    if (!r || r.kind !== 'hotels' || !n || n <= 0) return;
    S.rates[r.city] = { rate:n, name:String(o.name || '').slice(0, 120), source:String(o.source || '').slice(0, 60), url:safeHref(o.url) ? o.url : '' };
    setMsg('Using ' + money(n) + '/night for ' + r.city + '.');
    S.focus = ['[data-act="ag-rate"][data-i="' + i + '"][data-o="' + k + '"]', '[data-act="agent"]']; changed();
  }
  function useFare(i, k){
    var r = agRequests()[i], c = r && agCache[r.key], o = c && c.data.options && c.data.options[k];
    var n = o && fnum(o.priceTotal);
    if (!r || r.kind !== 'flights' || !n || n <= 0) return;
    S.fare.airfare = Math.round(n);
    if (typeof o.from === 'string' && Atlas.DEP_OPTS.some(function(d){ return d[0] === o.from; })) S.fare.dep = o.from;
    S.draft.mode = 'fly';
    S.fareNote = 'Using searched fare: ' + String(o.airline || '').slice(0, 60) + ' ' + String(o.from || '') + ' to ' + String(o.to || '') + ', ' + money(S.fare.airfare) + ' for the party.';
    setMsg('Airfare set to ' + money(S.fare.airfare) + '. Comparison switched to flying.');
    S.focus = ['[data-act="ag-fare"][data-i="' + i + '"][data-o="' + k + '"]', '[data-act="agent"]']; changed();
  }
  function clearRate(city){
    if (city == null) S.rates = {}; else delete S.rates[city];
    setMsg(city == null ? 'Searched hotel rates cleared.' : 'Searched rate for ' + city + ' cleared.');
    S.focus = ['[data-act="ag-rate-clear"]', '[data-act="back"]']; changed();
  }
  function ratesHTML(){
    var used = ratesInUse();
    if (!used.length) return '';
    return '<div class="pl-ovr"><b>Searched hotel rates are in this estimate</b><ul>' + used.map(function(x){
      var r = x.r;
      return '<li><span>' + E(x.city) + ': ' + E(money(r.rate)) + '/night' + (r.name ? ' · ' + E(r.name) : '') + (r.source ? ' (' + E(r.source) + ')' : '') + '</span>' +
        '<button type="button" class="linkbtn" data-act="ag-rate-clear" data-city="' + E(x.city) + '" aria-label="Clear searched rate for ' + E(x.city) + '">Clear</button></li>';
    }).join('') + '</ul>' + (used.length > 1 ? '<button type="button" class="linkbtn" data-act="ag-rate-clear" data-city="">Clear all</button>' : '') +
      '<p class="pl-note" style="margin:4px 0 0">Other stops use the researched or default rate. Searched rates are point-in-time, so check before booking.</p></div>';
  }

  /* ---------- save ---------- */
  function go(url){ window.location.assign(url); }
  async function save(){
    if (S.saving || !Atlas.auth.parent) return;
    var d = S.draft, x = totals();
    if (!stops().length || !x.t) return;
    var payload = {
      name: (d.name || autoName()).trim() || autoName(),
      start_date: d.start_date || null,
      stops: stops().map(function(s){
        var o = { city:s.city, nights:s.nights };
        if (s.custom === true) { if (validPos(s.lat, s.lon)) { o.lat = s.lat; o.lon = s.lon; } o.custom = true; }
        return o;
      }),
      mode: d.mode === 'fly' ? 'fly' : 'drive',
      est_cost: Math.round(x.total * 100) / 100,
      notes: d.notes || ''
    };
    S.saving = true; S.saveErr = ''; render();
    try {
      var t = d.id != null ? await Atlas.trips.update(d.id, payload) : await Atlas.trips.create(payload);
      clearDraft();
      go('/atlas/trips.html?id=' + encodeURIComponent(t && t.id != null ? t.id : d.id));
    } catch(e) {
      S.saving = false; S.saveErr = (e && e.message) || 'Could not save this trip.'; persist(); render();
    }
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), i = parseInt(b.getAttribute('data-i'), 10), a = stops();
    switch (act) {
      case 'goto': return goStep(parseInt(b.getAttribute('data-step'), 10));
      case 'next': return goStep(S.step + 1);
      case 'back': return goStep(S.step - 1);
      case 'inc': a[i].nights = clampN(a[i].nights + 1); S.focus = ['[data-act="inc"][data-i="' + i + '"]', '[data-act="dec"][data-i="' + i + '"]']; return changed();
      case 'dec': a[i].nights = clampN(a[i].nights - 1); S.focus = ['[data-act="dec"][data-i="' + i + '"]', '[data-act="inc"][data-i="' + i + '"]']; return changed();
      case 'up': move(i, i - 1); S.focus = ['[data-act="up"][data-i="' + (i - 1) + '"]', '[data-act="down"][data-i="' + (i - 1) + '"]']; return changed();
      case 'down': move(i, i + 1); S.focus = ['[data-act="down"][data-i="' + (i + 1) + '"]', '[data-act="up"][data-i="' + (i + 1) + '"]']; return changed();
      case 'rm': var gone = a.splice(i, 1)[0]; setMsg('Removed ' + gone.city + '.'); S.focus = ['#pl-city']; return changed();
      case 'best':
        var order = Atlas.recommendRoute(a), by = {};
        a.forEach(function(s){ by[s.city] = s; });
        S.draft.stops = order.map(function(c){ return by[c]; });
        setMsg('Best order: ' + order.join(' → ')); S.focus = ['[data-act="best"]']; return changed();
      case 'reset':
        if (typeof window.confirm === 'function' && !window.confirm('Clear this trip and start over?')) return;
        clearDraftState(); return render();
      case 'preset':
        var names = Atlas.data.PRESETS[b.getAttribute('data-k')] || [], added = 0;
        names.forEach(function(c){ if (addCity(c) === 'ok') added++; });
        setMsg(added ? 'Added ' + plural(added, 'stop') + ' from ' + b.getAttribute('data-k') + '.' : 'Those stops are already in your trip.');
        return changed();
      case 'findtf':
        S.tf.budget = parseFloat(document.getElementById('pl-tfb').value) || 0;
        S.tf.nights = Math.max(1, parseInt(document.getElementById('pl-tfn').value, 10) || 1);
        try { S.tf.results = Atlas.findTrips({ budget:S.tf.budget, nights:S.tf.nights }); } catch(e){ S.tf.results = []; }
        S.tf.open = true; return render();
      case 'usetf':
        var c = (S.tf.results || [])[i]; if (!c) return;
        S.draft.stops = c.route.map(function(city, k){ return { city:city, nights:clampN(c.nightsArr[k]) }; });
        S.tf.open = false; setMsg('Loaded ' + c.route.join(' → ') + '.'); return changed();
      case 'someday': S.draft.start_date = null; return changed();
      case 'mode': S.draft.mode = b.getAttribute('data-mode') === 'fly' ? 'fly' : 'drive'; persist(); S.focus = ['[data-act="mode"][data-mode="' + S.draft.mode + '"]']; return render();
      case 'fare': return fetchFare();
      case 'agent': return agPress(false);
      case 'agent-again': return agPress(true);
      case 'ag-retry':
        var rq = agRequests()[i]; if (!rq) return;
        delete agCache[rq.key]; agSaveCache(); S.ag.res[rq.key] = { status:'queued' }; agRun.queue.push(rq); agPump(); return renderAgent();
      case 'ag-gowhen': S.ag.needDate = ''; return goStep(1);
      case 'ag-rate': return useRate(i, parseInt(b.getAttribute('data-o'), 10));
      case 'ag-fare': return useFare(i, parseInt(b.getAttribute('data-o'), 10));
      case 'ag-rate-clear': return clearRate(b.getAttribute('data-city') || null);
      case 'addfree': return addFromText();
      case 'pick': return pickPending(parseInt(b.getAttribute('data-p'), 10), parseInt(b.getAttribute('data-o'), 10));
      case 'pick-name': return pickPending(parseInt(b.getAttribute('data-p'), 10), null);
      case 'pick-skip': return skipPending(parseInt(b.getAttribute('data-p'), 10));
      case 'save': return save();
      case 'settings':
        var gear = document.querySelector('.ac-gear');
        if (gear) { var dr = document.getElementById('ac-drawer'); if (!dr || dr.hidden) gear.click(); }
        else setMsg('Use the gear button at the top to change assumptions.');
        return;
    }
  });
  app.addEventListener('change', function(ev){
    var t = ev.target;
    if (t.id === 'pl-city') {
      var city = t.value; if (!city) return;
      var r = addCity(city);
      setMsg(r === 'ok' ? 'Added ' + city + '.' : r === 'dup' ? city + ' is already in your trip.' : (r || ''));
      S.focus = ['#pl-city']; changed();
    } else if (t.id === 'pl-start') {
      S.draft.start_date = isDate(t.value) ? t.value : null; changed();
    } else if (t.id === 'pl-dep') {
      S.fare.dep = t.value; S.ag.origin = null; persist(); updateCompare(); renderAgent();
    }
  });
  app.addEventListener('input', function(ev){
    var t = ev.target;
    if (t.id === 'pl-free') S.free.text = t.value;
    else if (t.id === 'pl-name') { S.draft.name = t.value === autoName() ? '' : t.value; persist(); }
    else if (t.id === 'pl-notes') { S.draft.notes = t.value; persist(); }
    else if (t.id === 'pl-fare') {
      S.fare.airfare = Math.max(0, parseFloat(t.value) || 0);
      if (S.fare.airfare <= 0 && S.draft.mode === 'fly') S.draft.mode = 'drive';
      persist(); updateCompare();
    }
  });
  app.addEventListener('toggle', function(ev){ if (ev.target && ev.target.id === 'pl-suggest') S.tf.open = ev.target.open; }, true);
  // drag and drop (the arrow buttons cover touch and keyboard)
  app.addEventListener('dragstart', function(ev){
    var li = ev.target.closest && ev.target.closest('.pl-stop'); if (!li) return;
    S.dragIdx = parseInt(li.getAttribute('data-i'), 10); li.classList.add('dragging');
    if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', String(S.dragIdx)); } catch(e){} }
  });
  app.addEventListener('dragover', function(ev){
    var li = ev.target.closest && ev.target.closest('.pl-stop'); if (!li || S.dragIdx == null) return;
    ev.preventDefault();
    app.querySelectorAll('.drop-before,.drop-after').forEach(function(n){ n.classList.remove('drop-before', 'drop-after'); });
    var r = li.getBoundingClientRect();
    li.classList.add(ev.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  });
  app.addEventListener('drop', function(ev){
    var li = ev.target.closest && ev.target.closest('.pl-stop'); if (!li || S.dragIdx == null) return;
    ev.preventDefault();
    var to = parseInt(li.getAttribute('data-i'), 10), r = li.getBoundingClientRect();
    if (ev.clientY >= r.top + r.height / 2) to++;
    var from = S.dragIdx; S.dragIdx = null;
    if (from < to) to--;
    move(from, to); changed();
  });
  app.addEventListener('dragend', function(){ S.dragIdx = null; render(); });

  function clearDraftState(){
    S.draft = blank(); S.fare = { dep:'GSP', airfare:0 }; S.fareNote = ''; S.saveErr = ''; S.msg = ''; S.step = 0; S.tf.results = null;
    S.rates = {}; S.ag = { res:{}, needDate:'', origin:null }; S.free = { text:'', busy:false, status:'', pending:[] };
    lsDel(DRAFT_KEY); lsDel(FARE_KEY); lsDel(RATES_KEY);
  }

  /* ---------- URL parameters ---------- */
  function stripParams(names){
    try {
      var p = new URLSearchParams(window.location.search);
      names.forEach(function(n){ p.delete(n); });
      var q = p.toString();
      window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : '') + (window.location.hash || ''));
    } catch(e){}
  }
  function findCity(name){
    var C = Atlas.data.CITIES || {}, lc = String(name).trim().toLowerCase();
    return Object.keys(C).filter(function(c){ return c.toLowerCase() === lc; })[0] || null;
  }
  async function init(){
    var p; try { p = new URLSearchParams(window.location.search); } catch(e){ return; }
    var tripId = p.get('trip'), adds = p.getAll('add');
    if (tripId) {
      if (!(S.draft.id != null && String(S.draft.id) === String(tripId))) {
        setMsg('Loading your trip…');
        try {
          var list = await Atlas.trips.list();
          var t = (list || []).filter(function(x){ return String(x.id) === String(tripId); })[0];
          if (t) {
            S.draft = { id:t.id, name:t.name || '', start_date:isDate(t.start_date) ? t.start_date : null, stops:cleanStops(t.stops),
              mode:t.mode === 'fly' ? 'fly' : 'drive', notes:t.notes || '' };
            S.fare = { dep:'GSP', airfare:0 }; S.fareNote = ''; S.rates = {}; S.ag = { res:{}, needDate:'', origin:null };
            persist(); setMsg('Editing “' + S.draft.name + '”. Save will update it.');
          } else setMsg('That trip was not found. Your current draft is unchanged.');
        } catch(e) { setMsg('Could not load that trip: ' + ((e && e.message) || 'unknown error')); }
      } else setMsg('Editing “' + S.draft.name + '”. Save will update it.');
    }
    if (adds.length) {
      if (adds.some(function(n){ return !findCity(n); })) { try { await Atlas.ready; } catch(e){} }
      var notes = [];
      adds.forEach(function(n){
        var c = findCity(n);
        if (!c) return;
        var r = addCity(c);
        notes.push(r === 'ok' ? 'Added ' + c : r === 'dup' ? c + ' was already in your trip' : (r || ''));
      });
      if (notes.length) { setMsg(notes.join('. ') + '.'); Atlas.toast(E(notes.join('. '))); }
      persist();
    }
    if (tripId || adds.length) stripParams(['add'].concat(tripId ? [] : []));
    render();
  }

  agLoadCache();
  S.draft = loadDraft();
  Atlas.onData(render);
  Atlas.onSettings(render);
  init();
})();
</script>
</body>
</html>
