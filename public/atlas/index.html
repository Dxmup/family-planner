<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · Hensel Family Adventure Atlas</title>
<link rel="stylesheet" href="/atlas/atlas.css">
<style>
  .xp-map{position:relative;background:linear-gradient(180deg,#F4F6EE,#E4E9DA);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:300px}
  .xp-map svg{display:block;width:100%;height:auto;max-width:100%}
  .xp-map .mp-line{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;opacity:.85}
  .xp-map .mp-dot{cursor:pointer;outline:none}
  .xp-map .mp-dot .hit{fill:transparent;stroke:transparent;stroke-width:2}
  .xp-map .mp-dot .pt{fill:var(--card);stroke:var(--pine);stroke-width:2;transition:r .12s}
  .xp-map .mp-dot.seen .pt{fill:var(--amber);stroke:var(--amber-deep)}
  .xp-map .mp-dot:hover .pt,.xp-map .mp-dot:focus .pt{stroke-width:3.5}
  .xp-map .mp-dot:focus-visible .hit{stroke:var(--pine)}
  .xp-map .mp-dot.dim{opacity:.28}
  .xp-map .mp-chk{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .xp-map .mp-lab{font:600 12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#F1F4EA;stroke-width:3.5px;
    stroke-linejoin:round;pointer-events:none}
  .xp-map .mp-lab.hid{opacity:0;transition:opacity .12s}
  .xp-map .mp-dot:hover .mp-lab.hid,.xp-map .mp-dot:focus .mp-lab.hid{opacity:1}
  .xp-map .mp-home .pt{fill:var(--pine);stroke:var(--amber);stroke-width:3}
  .xp-map .mp-home-lab{font:700 13px var(--serif);fill:var(--pine);paint-order:stroke;stroke:#F1F4EA;stroke-width:4px;stroke-linejoin:round}
  .xp-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
  .xp-legend span{display:inline-flex;align-items:center;gap:7px}
  .xp-legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--pine);background:var(--card)}
  .xp-legend i.h{background:var(--pine);border-color:var(--amber)}
  .xp-legend i.v{background:var(--amber);border-color:var(--amber-deep)}
  .xp-find{margin-top:26px}
  .xp-find h2,.xp-more summary{font-family:var(--serif);font-weight:600}
  .xp-find h2{font-size:22px;margin:0 0 12px}
  .xp-chips{display:flex;flex-wrap:wrap;gap:8px}
  .xp .chip{min-height:40px;padding:6px 14px;font-size:14px}
  .xp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 4px}
  .xp-bar .search{min-height:44px;font-size:16px;padding:8px 16px;min-width:0;flex:1 1 220px}
  .xp-sort{display:flex;gap:8px;flex:none}
  .xp-count{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:10px 2px 12px}
  .xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .xc{display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:.12s;
    border-left:5px solid var(--pine2)}
  .xc:hover,.xc:focus-visible{border-color:var(--amber);border-left-color:var(--amber);transform:translateY(-1px)}
  .xc:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .xc.seen{border-left-color:var(--amber)}
  .xc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .xc h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.01em;min-width:0}
  .xc-stamp{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    color:var(--amber-deep);border:1.5px solid var(--amber);border-radius:6px;padding:2px 6px;transform:rotate(-3deg);background:#FBF3E2}
  .xc-meta{font-family:var(--mono);font-size:12px;color:var(--amber-deep);font-weight:600}
  .xc-tease{font-size:13.5px;color:#33443c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xc-tease b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
  .xc-n{font-size:12.5px;color:var(--muted)}
  .xp-empty{text-align:center;color:var(--muted);padding:34px 0}
  .xp-more{margin-top:30px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 16px}
  .xp-more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:17px}
  .xp-more .corridors{padding:4px 0 16px}
  .xp-more a.node{text-decoration:none}
  .xp-more .route{overflow-x:visible}
  @media(max-width:520px){.xp-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="atlas-chrome"></div>
<main id="app" class="wrap ac-main xp"></main>
<script src="/atlas/atlas-core.js"></script>
<script>
Atlas.mountChrome('explore');

const esc = Atlas.esc;
const state = { themes: new Set(), q: '', sort: 'near', visited: new Set() };
let gridBound = false;

// ---- helpers (all read Atlas.data at call time) ----
function shortName(c) { return String(c).split(/ \/ | \(/)[0]; }

// Corridor nodes are labels like "Columbus / Indy" or "NC Triangle"; map each to the CITIES keys it names.
const NODE_ALIAS = { indy: 'Indianapolis', philly: 'Philadelphia' };
function nodeCities(label) {
  const names = Object.keys(Atlas.data.CITIES), out = [];
  String(label).split(' / ').forEach(part => {
    const p = part.trim().toLowerCase();
    const hit = NODE_ALIAS[p] || names.find(n => n.toLowerCase().indexOf(p) !== -1);
    if (hit && out.indexOf(hit) === -1) out.push(hit);
  });
  return out;
}

function cityInfo() {
  const D = Atlas.data, counts = {};
  D.A.forEach(a => { counts[a[1]] = (counts[a[1]] || 0) + 1; });
  return Object.keys(D.CITIES).map(c => {
    const pb = D.PLAYBOOKS.find(p => p.city === c);
    const themes = new Set(), attrNames = [];
    D.A.forEach(a => { if (a[1] === c) { a[2].split(',').forEach(t => themes.add(t)); attrNames.push(a[0].toLowerCase()); } });
    return { city: c, drive: D.CITIES[c].drive, miles: Math.round(Atlas.dist(Atlas.HOME, c)),
      signature: pb ? pb.signature : '', n: counts[c] || 0, themes: themes, attrNames: attrNames };
  });
}

function matches(info) {
  if (state.themes.size && ![...state.themes].some(t => info.themes.has(t))) return false;
  if (state.q) {
    const q = state.q;
    if (info.city.toLowerCase().indexOf(q) === -1 && !info.attrNames.some(n => n.indexOf(q) !== -1)) return false;
  }
  return true;
}

function visibleCities() {
  const list = cityInfo().filter(matches);
  list.sort(state.sort === 'name' ? (a, b) => a.city.localeCompare(b.city) : (a, b) => a.miles - b.miles || a.city.localeCompare(b.city));
  return list;
}

// ---- map ----
function drawMap() {
  const host = document.getElementById('map');
  if (!host) return;
  const D = Atlas.data, P = D.COORDS, names = Object.keys(P);
  const W = Math.max(280, Math.round(host.clientWidth || 720));
  const narrow = W < 520;
  const H = Math.round(Math.min(Math.max(W * 0.92, 300), 620));
  const pad = narrow ? 30 : 44;
  const lats = names.map(n => P[n][0]), lons = names.map(n => P[n][1]);
  const latMin = Math.min.apply(null, lats), latMax = Math.max.apply(null, lats);
  const lonMin = Math.min.apply(null, lons), lonMax = Math.max.apply(null, lons);
  const k = Math.cos(((latMin + latMax) / 2) * Math.PI / 180);
  const spanX = (lonMax - lonMin) * k, spanY = latMax - latMin;
  const s = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const ox = (W - spanX * s) / 2, oy = (H - spanY * s) / 2;
  const xy = n => [ox + (P[n][1] - lonMin) * k * s, oy + (latMax - P[n][0]) * s];
  const f = v => Math.round(v * 10) / 10;

  // corridor lines: home -> each node that names a known city
  const lines = D.COR.map(c => {
    const pts = [xy(Atlas.HOME)];
    c[2].forEach(nd => { if (nd[1] === 'home') return; const cs = nodeCities(nd[0]); if (cs.length && P[cs[0]]) pts.push(xy(cs[0])); });
    return `<polyline class="mp-line" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;
  }).join('');

  const shown = new Set(visibleCities().map(i => i.city));
  const dotNames = Object.keys(D.CITIES).filter(c => P[c]);
  const fs = narrow ? 11 : 12.5, R = narrow ? 6 : 7;
  const dots = dotNames.map(c => ({ c: c, p: xy(c), lab: shortName(c), miles: Atlas.dist(Atlas.HOME, c) }));
  const homeP = xy(Atlas.HOME);

  // greedy label placement: try right, left, above, below; skip a label if every spot collides
  const boxes = [];
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const dotBoxes = dots.map(d => ({ x: d.p[0] - R - 2, y: d.p[1] - R - 2, w: 2 * R + 4, h: 2 * R + 4 })).concat([{ x: homeP[0] - 12, y: homeP[1] - 12, w: 24, h: 24 }]);
  const homeLab = 'Home';
  const hw = homeLab.length * 8 + 4;
  const hb = { x: homeP[0] + 12, y: homeP[1] - 8, w: hw, h: 16 };
  boxes.push(hb);
  const placed = {};
  dots.slice().sort((a, b) => a.miles - b.miles).forEach(d => {
    const w = d.lab.length * fs * 0.58 + 4, h = fs + 4, g = R + 4, x = d.p[0], y = d.p[1];
    const cands = [
      { x: x + g, y: y - h / 2, a: 'start', tx: x + g + 1 },
      { x: x - g - w, y: y - h / 2, a: 'end', tx: x - g - 1 },
      { x: x - w / 2, y: y - g - h, a: 'middle', tx: x, ty: y - g - 3 },
      { x: x - w / 2, y: y + g, a: 'middle', tx: x, ty: y + g + fs - 1 }
    ];
    for (let i = 0; i < cands.length; i++) {
      const c = cands[i], b = { x: c.x, y: c.y, w: w, h: h };
      if (b.x < 2 || b.x + b.w > W - 2 || b.y < 2 || b.y + b.h > H - 2) continue;
      if (boxes.some(o => hit(b, o))) continue;
      if (dotBoxes.some((o, j) => dots[j] !== d && hit(b, o))) continue;
      boxes.push(b); placed[d.c] = { a: c.a, tx: c.tx, ty: c.ty === undefined ? y + fs * 0.35 : c.ty };
      return;
    }
    placed[d.c] = { hidden: true, a: 'start', tx: x + g + 1, ty: y + fs * 0.35 };
  });

  const dotSvg = dots.map(d => {
    const seen = state.visited.has(d.c), pl = placed[d.c];
    const x = f(d.p[0]), y = f(d.p[1]);
    const lbl = d.c + ', about ' + Atlas.data.CITIES[d.c].drive.replace('~', '') + ' drive' + (seen ? ', visited' : '');
    const chk = seen ? `<path class="mp-chk" d="M${f(x - 3)} ${y} l2.2 2.4 l4 -4.6"/>` : '';
    return `<a class="mp-dot${seen ? ' seen' : ''}${shown.has(d.c) ? '' : ' dim'}" href="${esc(Atlas.cityUrl(d.c))}" aria-label="${esc(lbl)}">`
      + `<title>${esc(d.c)}</title><circle class="hit" cx="${x}" cy="${y}" r="${narrow ? 19 : 20}"/>`
      + `<circle class="pt" cx="${x}" cy="${y}" r="${R}"/>${chk}`
      + `<text class="mp-lab${pl.hidden ? ' hid' : ''}" style="font-size:${fs}px" x="${f(pl.tx)}" y="${f(pl.ty)}" text-anchor="${pl.a}">${esc(d.lab)}</text></a>`;
  }).join('');

  const home = `<g class="mp-home"><circle class="pt" cx="${f(homeP[0])}" cy="${f(homeP[1])}" r="${R + 3}"/>`
    + `<text class="mp-home-lab" x="${f(homeP[0] + 13)}" y="${f(homeP[1] + 4)}">${homeLab}</text></g>`;

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" `
    + `aria-label="Map of ${dots.length} destinations around ${esc(Atlas.HOME)}. Each dot links to that place.">${lines}${home}${dotSvg}</svg>`;
}

// ---- grid ----
function cardHTML(i) {
  const seen = state.visited.has(i.city);
  return `<a class="xc${seen ? ' seen' : ''}" href="${esc(Atlas.cityUrl(i.city))}">`
    + `<span class="xc-top"><h3>${esc(i.city)}</h3>${seen ? '<span class="xc-stamp">Been there</span>' : ''}</span>`
    + `<span class="xc-meta">${esc(i.drive)} drive · ${i.miles} mi</span>`
    + (i.signature ? `<span class="xc-tease"><b>Must-do</b>${esc(i.signature)}</span>` : '')
    + `<span class="xc-n">${i.n} thing${i.n === 1 ? '' : 's'} to do</span></a>`;
}

function drawGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const list = visibleCities(), total = Object.keys(Atlas.data.CITIES).length;
  grid.innerHTML = list.length ? list.map(cardHTML).join('')
    : `<p class="xp-empty">No place matches that. <button class="reset" type="button" data-act="clear">Clear filters</button></p>`;
  const cnt = document.getElementById('count');
  if (cnt) cnt.textContent = list.length === total ? `All ${total} places` : `${list.length} of ${total} places`;
  drawMap();
}

function toggleTheme(k, btn) {
  state.themes.has(k) ? state.themes.delete(k) : state.themes.add(k);
  if (btn) btn.setAttribute('aria-pressed', String(state.themes.has(k)));
  drawGrid();
}
function setSort(v) {
  state.sort = v;
  document.querySelectorAll('[data-sort]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sort === v)));
  drawGrid();
}
function setQuery(q) { state.q = String(q || '').toLowerCase().trim(); drawGrid(); }
function clearFilters() {
  state.themes.clear(); state.q = '';
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  const s = document.getElementById('search'); if (s) s.value = '';
  drawGrid();
}

// ---- corridor chains (secondary) ----
function corridorsHTML() {
  return Atlas.data.COR.map(c => {
    const nodes = c[2], segs = c[3];
    let route = '';
    nodes.forEach((n, i) => {
      const cs = n[1] === 'home' ? [] : nodeCities(n[0]);
      const inner = `<span class="dot"></span>${esc(n[0])}`;
      route += cs.length ? `<a class="node ${esc(n[1])}" href="${esc(Atlas.cityUrl(cs[0]))}">${inner}</a>` : `<span class="node ${esc(n[1])}">${inner}</span>`;
      if (i < segs.length) route += `<span class="seg">${esc(segs[i])}</span>`;
    });
    // c[4] (branch) is trusted HTML, intentionally not escaped
    return `<div class="corridor"><div class="cor-tag">${esc(c[1])}</div><h3>${esc(c[0])}</h3><div class="route">${route}</div><div class="branch">${c[4]}</div></div>`;
  }).join('');
}

// ---- page ----
function render() {
  const app = document.getElementById('app');
  const themes = Atlas.data.THEMES;
  const chips = Object.keys(themes).map(k =>
    `<button class="chip" type="button" data-theme="${esc(k)}" aria-pressed="${state.themes.has(k)}">`
    + `<span class="swatch" style="background:${themes[k][1]}"></span>${esc(themes[k][0])}</button>`).join('');
  app.innerHTML = `<h1 class="page-title">Where to next?</h1>`
    + `<p class="page-sub" style="margin-bottom:14px">Tap a place to see what is there.</p>`
    + `<div class="xp-map" id="map"></div>`
    + `<div class="xp-legend"><span><i class="h"></i>Home</span><span><i></i>Not yet</span><span><i class="v"></i>Been there</span><span>Dotted lines are the driving routes</span></div>`
    + `<section class="xp-find" aria-label="Find a place"><h2>Pick your kind of day</h2>`
    + `<div class="xp-chips" role="group" aria-label="Filter by theme">${chips}</div>`
    + `<div class="xp-bar"><input class="search" id="search" type="search" placeholder="Search places or things, e.g. manatee" aria-label="Search places and attractions" value="${esc(state.q)}">`
    + `<div class="xp-sort" role="group" aria-label="Sort places">`
    + `<button class="chip" type="button" data-sort="near" aria-pressed="${state.sort === 'near'}">Nearest</button>`
    + `<button class="chip" type="button" data-sort="name" aria-pressed="${state.sort === 'name'}">A to Z</button></div></div>`
    + `<p class="xp-count" id="count" role="status" aria-live="polite"></p>`
    + `<div class="xp-grid" id="grid"></div></section>`
    + `<details class="xp-more"><summary>How the stops chain together</summary><div class="corridors">${corridorsHTML()}</div></details>`;
  if (!gridBound) {
    gridBound = true;
    app.addEventListener('click', e => {
      const t = e.target && e.target.closest ? e.target : null; if (!t) return;
      const th = t.closest('[data-theme]'), so = t.closest('[data-sort]'), cl = t.closest('[data-act="clear"]');
      if (th) toggleTheme(th.dataset.theme, th); else if (so) setSort(so.dataset.sort); else if (cl) clearFilters();
    });
    app.addEventListener('input', e => { if (e.target && e.target.id === 'search') setQuery(e.target.value); });
    let lastW = 0, tm;
    window.addEventListener('resize', () => {
      clearTimeout(tm);
      tm = setTimeout(() => { const m = document.getElementById('map'); if (m && m.clientWidth !== lastW) { lastW = m.clientWidth; drawMap(); } }, 150);
    });
  }
  state.q = state.q; // query already restored into the input
  drawGrid();
}

Atlas.onData(render);

// Visited marks are optional: any failure just leaves everything unvisited.
Atlas.marks.list().then(rows => {
  state.visited = new Set((rows || []).filter(r => r && r.visited).map(r => r.city));
  if (state.visited.size) drawGrid();
}).catch(() => {});
</script>
</body>
</html>
