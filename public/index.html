<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#faf7f2">
<title>Family Planner</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div id="clock">
      <div id="clock-time">--:--</div>
      <div id="clock-date">&nbsp;</div>
    </div>
    <button class="nav-btn active" data-view="today"><span class="nav-icon">🏠</span><span>Today</span></button>
    <button class="nav-btn" data-view="calendar"><span class="nav-icon">📅</span><span>Calendar</span></button>
    <button class="nav-btn" data-view="meals"><span class="nav-icon">🍽️</span><span>Meals</span></button>
    <button class="nav-btn" data-view="chores"><span class="nav-icon">⭐</span><span>Chores</span></button>
    <button class="nav-btn" data-view="routines"><span class="nav-icon">☀️</span><span>Routines</span></button>
    <button class="nav-btn" data-view="lists"><span class="nav-icon">📝</span><span>Lists</span></button>
    <button class="nav-btn" data-view="family"><span class="nav-icon">👪</span><span>Family</span></button>
    <button class="nav-btn" id="parent-btn" style="margin-top:auto"><span class="nav-icon">🔒</span><span>Parent</span></button>
  </nav>
  <main id="main"></main>
</div>
<div id="modal-backdrop" class="hidden">
  <div id="modal"></div>
</div>
<div id="screensaver" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
